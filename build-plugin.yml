# Builds the Xtream Football Finder Jellyfin plugin and publishes it as a GitHub Release,
# including a manifest.json so Jellyfin can install it straight from its plugin catalogue.
# Works on its own: the plugin source is embedded at the bottom of this file.
# (If the repo also contains the source files, those are used instead.)
name: Build Jellyfin plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Get source
        run: |
          if [ -f XtreamFootball.csproj ]; then
            echo "Using source files from the repository"
            mkdir -p src && cp -r XtreamFootball.csproj *.cs meta.json build.sh make-manifest.py Configuration Services Api src/
          else
            echo "Using source embedded in this workflow"
            mkdir -p src
            echo "$EMBEDDED" | tr -d ' \n' | base64 -d | tar -xz -C src
          fi
