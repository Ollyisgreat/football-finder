      - name: Build zips
        working-directory: src
        run: bash build.sh

      - name: Publish release + Jellyfin catalogue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls src/dist/repo/*.zip >/dev/null 2>&1 || { echo "No zips built"; exit 1; }
          tag="build-${{ github.run_number }}"
          python3 src/make-manifest.py "https://github.com/${{ github.repository }}/releases/download/$tag"
          gh release create "$tag" src/dist/*.zip src/dist/repo/*.zip src/dist/repo/manifest.json \
            --repo "${{ github.repository }}" --latest \
            --title "Xtream Football Finder (build ${{ github.run_number }})" \
            --notes "Install from Jellyfin: Dashboard > Plugins > Repositories > add https://github.com/${{ github.repository }}/releases/latest/download/manifest.json (repo must be public). Or install by hand with the XtreamFootball-jellyfin-<version>.zip matching your server."
